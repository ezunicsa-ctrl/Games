body{background:var(--ink);color:var(--text);font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;background:var(--sky)}
#game canvas{display:block;width:100%;height:100%}

.hud{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;max-width:min(330px,62vw)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip[hidden]{display:none!important}
.medal-dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold1),var(--gold2));box-shadow:0 0 0 2px rgba(255,194,58,.35)}
.paw{width:12px;height:12px;border-radius:4px;background:var(--leaf)}
#hint{border-radius:14px;font-family:var(--body);font-weight:700;font-size:13px;line-height:1.35;color:var(--muted)}
#hint:empty{display:none}
.topright{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--display);font-weight:600;font-size:14px;border-radius:999px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

#fact{position:fixed;z-index:6;left:50%;bottom:calc(190px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px;backdrop-filter:blur(8px);display:flex;gap:12px;align-items:flex-start}
#fact[hidden]{display:none!important}
#fact .tag{flex:none;background:var(--leaf);color:var(--leafInk);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:4px 8px}
#fact p{margin:0;font-size:14px;line-height:1.4}
#fact strong{font-family:var(--display);font-size:16px;display:block;margin-bottom:2px}

#joy{position:fixed;z-index:5;left:max(20px,calc(env(safe-area-inset-left,0px) + 12px));bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:132px;height:132px;border-radius:50%;background:rgba(19,32,42,.38);border:2px solid var(--line);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(243,247,250,.85);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.btns{position:fixed;z-index:5;right:max(20px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(24px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(2,72px);gap:12px;justify-items:center;align-items:end}
.btn{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);
  font-family:var(--display);font-weight:700;font-size:14px;line-height:1.05;cursor:pointer;touch-action:none;padding:4px}
.btn.primary{background:var(--sun);color:var(--sunInk);border-color:transparent;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.btn.green{background:var(--leaf);color:var(--leafInk);border-color:transparent}
.btn:active,.btn.on{transform:scale(.94);filter:brightness(1.1)}
.btn[hidden]{display:none!important}
.keys{display:none}
@media (hover:hover) and (pointer:fine){ #joy{opacity:.55} .keys{display:block} }

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(143,203,239,.5),rgba(19,32,42,.88));overflow:auto}
.overlay[hidden]{display:none!important}
.card{width:min(560px,100%);background:var(--ink);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.card h1,.card h2{margin:0;font-family:var(--display);font-weight:700;line-height:1;text-wrap:balance}
.card h1{font-size:clamp(34px,8vw,48px)} .card h2{font-size:clamp(26px,6vw,34px)}
.card h1 span,.card h2 span{color:var(--sun)}
.lede{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:60ch}
.todo{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.todo li{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.todo li i{flex:none;width:10px;height:10px;border-radius:3px;background:var(--c)}
.controls{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.controls kbd{font-family:var(--display);font-size:12px;background:rgba(255,255,255,.1);border-radius:5px;padding:1px 6px;color:var(--text)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.cta{border:0;border-radius:999px;background:var(--sun);color:var(--sunInk);font-family:var(--display);font-weight:700;font-size:20px;padding:12px 30px;cursor:pointer}
.cta.ghost{background:transparent;color:var(--text);border:2px solid var(--line);font-size:17px}
.cta:disabled{opacity:.45;cursor:default}

/* maths lesson: chalkboard card */
.board{background:var(--chalk);border:10px solid #8a6a4a;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.board .meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:600;color:#d8efe0;font-size:15px}
.dots{display:flex;gap:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #d8efe0;box-sizing:border-box}
.dots i.done{background:var(--sun);border-color:var(--sun)}
.eq{font-family:var(--display);font-weight:700;font-size:clamp(48px,14vw,72px);text-align:center;color:#fff;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.eq em{font-style:normal;color:var(--sun)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{border:0;border-radius:16px;background:#f3f7fa;color:var(--ink);font-family:var(--display);font-weight:700;font-size:32px;padding:14px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.ans.ok{background:var(--leaf);color:#fff}
.ans.bad{background:var(--coral);color:#fff;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:22px;margin:0;text-align:center;font-weight:800;color:#d8efe0;font-size:16px}
.medal{width:120px;height:150px;margin:0 auto;position:relative}
.medal::before{content:"";position:absolute;left:50%;top:0;width:60px;height:70px;margin-left:-30px;background:linear-gradient(90deg,#2b5fb4 0 33%,#f3f7fa 33% 66%,#e2553f 66%);clip-path:polygon(0 0,100% 0,70% 100%,30% 100%)}
.medal::after{content:attr(data-n);position:absolute;left:50%;bottom:0;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold1),var(--gold2) 70%);box-shadow:0 0 0 6px #b37d0d inset,0 10px 30px rgba(255,194,58,.4);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:40px;color:#6b4300}
#mapCanvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:16px;background:#4f8f3e;display:block}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.go button{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:12px;padding:10px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;display:flex;gap:8px;align-items:center}
.go button i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pick button{border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:16px;padding:14px 10px;font-family:var(--display);font-weight:600;font-size:18px;cursor:pointer}
.pick button.sel{border-color:var(--sun);background:rgba(255,194,58,.16)}
.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ages button{border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:16px;padding:12px 0;font-family:var(--display);font-weight:700;font-size:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.ages button.sel{background:var(--sun);color:var(--sunInk);border-color:var(--sun)}
.ages small{display:block;font-size:11px;font-weight:600;opacity:.8}
.lbl{margin:0;font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.subjects button{border:0;border-radius:18px;padding:14px 4px;font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--c);min-width:0}
.subjects button span{font-size:30px;line-height:1;white-space:nowrap}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.btn .ic{font-size:27px;line-height:1}
.btn .tx{font-size:11px;line-height:1.05;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qvis .pat{font-size:40px;line-height:1}
.qvis .pat.q{font-family:var(--display);font-weight:700;color:var(--sun)}
.ans.hintme{outline:5px solid var(--sun);outline-offset:2px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.qtext{margin:0;text-align:center;font-family:var(--display);font-weight:600;font-size:clamp(20px,5vw,26px);color:#fff;line-height:1.25;text-wrap:balance}
.qvis{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;min-height:70px}
.qvis .dot{width:34px;height:34px;border-radius:50%;background:var(--sun);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.qvis .dot.b{background:#7fd0ff}
.qvis .op{font-family:var(--display);font-weight:700;font-size:44px;color:#fff;margin:0 4px}
.qvis .big{font-size:84px;line-height:1}
.qvis .sw{width:110px;height:110px;border-radius:24px;border:4px solid rgba(255,255,255,.7)}
.qvis .word{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,52px);color:#fff;letter-spacing:.08em}
.ans.sw{min-height:84px;border:4px solid rgba(255,255,255,.6)}
.ans.pic{font-size:52px;padding:8px 0;line-height:1.2}
.ans.txt{font-size:24px;letter-spacing:.04em}
.ans.ok{outline:5px solid var(--leaf);outline-offset:2px}
.ans.bad{outline:5px solid var(--coral);outline-offset:2px;opacity:.55}
.mini{border:1px solid rgba(255,255,255,.35);background:transparent;color:#d8efe0;font-family:var(--display);font-weight:600;font-size:14px;border-radius:999px;padding:4px 12px;cursor:pointer}
#hotbar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(168px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 24px);box-sizing:border-box;display:flex;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow-x:auto;backdrop-filter:blur(6px);touch-action:pan-x}
#hotbar[hidden]{display:none!important}
#hotbar button{flex:none;width:44px;height:44px;border-radius:10px;border:3px solid transparent;background-color:rgba(255,255,255,.1);background-size:cover;image-rendering:pixelated;cursor:pointer;padding:0;font-size:22px;line-height:1}
#hotbar button.sel{border-color:var(--sun);transform:translateY(-3px)}
#hotbar .sep{flex:none;width:1px;background:var(--line);margin:2px}
body.building #fact{bottom:calc(250px + env(safe-area-inset-bottom,0px))}
@media (hover:hover) and (pointer:fine){ #hotbar{bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 440px)} body.building #fact{bottom:calc(110px + env(safe-area-inset-bottom,0px))} }
/* ===== ui.css: one design language. Tokens first, then each part. ===== */
:root{
  --display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  --paper:#fffdf6; --paper2:#fff0d0; --ink-t:#22304a; --muted-t:#5b6a85; --edge:#eadfc4;
  --sunDeep:#c98a00; --leafDeep:#2f8a3b; --r-card:30px; --r-btn:20px;
  --lift:0 4px 0 rgba(34,48,74,.18),0 8px 18px rgba(0,0,0,.18);
  --tap:56px;
  --j:clamp(116px,32vh,150px);   /* joystick size */
  --b:clamp(68px,17vh,88px);     /* action button size */
  --edge-x:max(16px,calc(env(safe-area-inset-left,0px) + 8px));
  --edge-r:max(16px,calc(env(safe-area-inset-right,0px) + 8px));
  --edge-b:calc(16px + env(safe-area-inset-bottom,0px));
  --t:.18s cubic-bezier(.2,.8,.2,1);
  --pad:clamp(16px,4vw,28px);    /* card padding */
  --col:760px;                   /* widest line of content in a card */
  --mb:56px;                     /* round button on the map and on the board */
}
body{touch-action:none}

/* HUD chips: light, big, readable */
.chip{background:rgba(255,255,255,.95);color:var(--ink-t);border:3px solid #fff;box-shadow:var(--lift);backdrop-filter:none;
  font-size:clamp(18px,2.6vw,22px);padding:4px 16px;min-height:44px;box-sizing:border-box;gap:8px}
.chip:empty{display:none}
#hint{background:#fff3c4;color:#5a3d00;font-size:clamp(14px,1.6vw,16px);line-height:1.3;border-radius:18px;padding:5px 14px}
.medal-dot{width:20px;height:20px}
.paw{width:18px;height:18px;border-radius:6px}
.hud{gap:10px;max-width:min(380px,calc(100vw - 160px))}
.hud .row{gap:8px}

/* top right: round icon buttons */
body .topright{top:calc(12px + env(safe-area-inset-top,0px));right:var(--edge-r);gap:10px;max-width:none;flex-wrap:nowrap}
.icon-btn{width:var(--tap);height:var(--tap);padding:0;border-radius:50%;background:#fff;color:var(--ink-t);border:3px solid #fff;box-shadow:var(--lift);
  font-size:28px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:transform var(--t)}
.icon-btn:active{transform:translateY(3px) scale(.96)}
#mapBtn,#helpBtn{font-size:0}
/* icons from the sprite: sized in em, colored with currentColor */
.ic{width:1em;height:1em;flex:none;fill:currentColor;vertical-align:-.14em}
.i-star{color:#f5a800} .i-heart{color:#e2553f} .i-target{color:#e2553f} .i-gift{color:#e2553f} .i-timer{color:#2b5fb4} .i-hourglass-medium{color:#c98a00}
.i-question{color:#8a5cd6} .i-trash{color:#e2553f} .i-check{color:#2f8a3b} .i-map-trifold{color:#2b5fb4}
/* map and help icons are pseudo elements: they use a mask */
#mapBtn::before,#helpBtn::before,#play::before,#setupGo::after,#subjClose::before,#lessonClose::before,#mapClose::before,#medalDone::before{content:"";display:inline-block;flex:none;
  background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
#mapBtn::before{--m:var(--m-map-trifold);width:32px;height:32px;color:#2b7fd6}
#helpBtn::before{--m:var(--m-question);width:32px;height:32px;color:#8a5cd6}
#taskBtn{background:#ffe9a8}
#taskBtn .ic,#parBtn .ic{width:32px;height:32px}
#parBtn{background:#e4e9f0;color:#5b6a85}
@media (max-width:560px){ body .topright{display:grid;grid-template-columns:repeat(2,var(--tap))} }

/* fact card */
#fact{background:#fff;color:var(--ink-t);border:3px solid #fff;border-radius:24px;padding:12px 18px;backdrop-filter:none;box-shadow:var(--lift);
  bottom:calc(var(--j) + 36px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100vw - 32px))}
#fact .tag{background:var(--leaf);color:#fff;font-size:14px;border-radius:10px;padding:5px 10px}
#fact p{font-size:16px}
#fact strong{font-size:20px}
body.building #fact{bottom:calc(var(--j) + 108px + env(safe-area-inset-bottom,0px))}

/* touch controls */
#joy{left:var(--edge-x);bottom:var(--edge-b);width:var(--j);height:var(--j);background:rgba(255,255,255,.3);border:4px solid rgba(255,255,255,.75);box-shadow:inset 0 0 0 6px rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.2)}
#knob{width:42%;height:42%;margin:0;transform:translate(-50%,-50%);left:50%;top:50%;background:#fff;box-shadow:0 5px 0 rgba(34,48,74,.25),0 8px 16px rgba(0,0,0,.25)}
body .btns{right:var(--edge-r);bottom:var(--edge-b);grid-template-columns:repeat(2,var(--b));gap:12px}
.btn{position:relative;width:var(--b);height:var(--b);background:#fff;color:var(--ink-t);border:3px solid #fff;box-shadow:var(--lift);transition:transform var(--t),filter var(--t)}
.btn .ic{font-size:calc(var(--b) * .42)}
.btn .tx{font-size:clamp(12px,calc(var(--b) * .17),15px);max-width:calc(var(--b) - 8px);font-weight:700}
.btn.primary{background:var(--sun);color:var(--sunInk);box-shadow:0 5px 0 var(--sunDeep),0 10px 20px rgba(0,0,0,.25)}
.btn.green{background:#7fd88a;color:#0d3a14;box-shadow:0 5px 0 var(--leafDeep),0 10px 20px rgba(0,0,0,.2)}
.btn:active,.btn.on{transform:translateY(4px) scale(.96);filter:none}

/* desktop: key hints, no joystick. A touch laptop has any-pointer:coarse, so it keeps the joystick. */
.kb{display:none;position:fixed;z-index:5;left:var(--edge-x);bottom:var(--edge-b);gap:14px;align-items:center;pointer-events:none;
  background:rgba(255,255,255,.92);border-radius:22px;padding:8px 14px;box-shadow:var(--lift);font-size:22px}
.kb span{display:inline-flex;gap:5px;align-items:center;color:var(--ink-t)}
kbd{font-family:var(--display);font-size:16px;font-weight:700;min-width:28px;height:28px;box-sizing:border-box;padding:0 6px;display:inline-grid;place-items:center;
  background:#fff;color:var(--ink-t);border:2px solid var(--edge);border-bottom-width:4px;border-radius:8px}
@media (hover:hover) and (pointer:fine) and (not (any-pointer:coarse)){
  #joy{display:none}
  .kb{display:flex}
  .btn::after{position:absolute;right:-4px;top:-4px;min-width:26px;height:26px;border-radius:8px;box-sizing:border-box;padding:0 5px;display:grid;place-items:center;
    background:var(--ink-t);color:#fff;font-family:var(--display);font-size:14px;font-weight:700}
  #btnAct::after{content:"E"} #btnHitch::after{content:"T"} #btnUp::after{content:"␣"} #btnDown::after{content:"⇧"}
  [data-i="cTouch"]{display:none}
  #hotbar{bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 440px)}
  body.building #fact{bottom:calc(172px + env(safe-area-inset-bottom,0px))}
  #fact{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
}

/* hotbar */
#hotbar{background:rgba(255,255,255,.94);border:3px solid #fff;border-radius:22px;box-shadow:var(--lift);backdrop-filter:none;
  bottom:calc(var(--j) + 36px + env(safe-area-inset-bottom,0px))}
#hotbar button{width:52px;height:52px;border-radius:14px;background-color:#eef1f6}
#hotbar .sep{background:var(--edge)}
#hotbar button{display:inline-grid;place-items:center;color:var(--ink-t)}
#hotbar button .ic{width:30px;height:30px}

/* overlays: soft sky backdrop, card pops in. The card fills the screen. A large screen gets a large panel (see the media rule below). */
.overlay{background:linear-gradient(180deg,rgba(143,203,239,.78),rgba(255,214,120,.7));backdrop-filter:blur(3px);overscroll-behavior:contain;touch-action:pan-y;
  grid-template-columns:minmax(0,1fr);padding:0;place-items:stretch}
.overlay:not([hidden]){animation:ovIn .22s ease-out}
.overlay:not([hidden]) .card{animation:cardIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes ovIn{from{opacity:0}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.card{--text:var(--ink-t);--muted:var(--muted-t);--line:var(--edge);min-width:0;color:var(--ink-t);background:linear-gradient(180deg,var(--paper),var(--paper2));
  width:auto;container-type:inline-size;justify-content:safe center;align-items:center;border:0;border-radius:0;box-shadow:none;gap:14px;

    const h = n.P.g.rotation.y, nx = p.x + Math.sin(h) * n.sp * dt, nz = p.z + Math.cos(h) * n.sp * dt;

// Merge parts [geometry, colour, wing flag] into one geometry with vertex colours.
function lifeGeo(parts) {
  const pos = [], nor = [], col = [], wing = [];
  for (const [g0, hex, w] of parts) {
    const g = g0.index ? g0.toNonIndexed() : g0, c = lifeLin(hex), n = g.attributes.position.count;

  out.setAttribute('aW', new THREE.Float32BufferAttribute(wing, 1));

// A flat pair of wings from one outline [x, z] of the right wing. The hinge is the line x = 0.
function lifeWing(pts, y) {

  for (const sx of [1, -1]) for (let i = 1; i < pts.length - 1; i++) for (const q of [pts[0], pts[i], pts[i + 1]]) { pos.push(q[0] * sx, y, q[1]); nor.push(0, 1, 0); }

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));

const SND_ROAR = { brachio: 0.7, pachy: 0.9, raptor: 1.4, ptera: 1.6 };

{ const f = coastFerryLeg; coastFerryLeg = function (leg, on) { if (!(leg % 2) && coastFerry.rode && on) tone('sawtooth', 150, 140, 0.9, 0.05); f(leg, on); }; }
function sndDolphins() {
  coastDolphins.list.forEach((d, i) => {
    const u = ((clock - d.at) % d.every) / 1.5, up = u >= 0 && u < 1, p = sndPos(), k = clamp(1 - Math.hypot(p.x - d.x, p.z - d.z) / 120, 0, 1);
    if (up && !snd.dol[i] && coastIsle.g.visible && running && k > 0.02) { tone('sine', 1500, 3000, 0.35, 0.04 * k); sndN(1500, 0.8, 0.3, 0.1 * k, 0.7); }
    snd.dol[i] = up;
  });
}

// ----- UI: a soft click on each button. The answers of a quiz and the control buttons have their own sounds. -----
document.addEventListener('pointerdown', e => { const b = e.target.closest && e.target.closest('button'); if (b && !b.disabled && !b.closest('.ans, .btn')) tone('sine', 700, 500, 0.05, 0.03); });

// ----- the tab: stop the sound when the tab is hidden -----
document.addEventListener('visibilitychange', () => { if (!audio) return; if (document.hidden) audio.suspend(); else if (audio.state === 'suspended') audio.resume(); });

onFrame.push(dt => {

  sndWalk(); sndDolphins();
  if ((snd.t += dt) < 0.25) return;
  const d = snd.t, p = sndPos(); snd.t = 0;

});
